name: Genereer wekelijks artikel

on:
  schedule:
    # Elke maandag 08:00 UTC. Pas aan naar wens.
    - cron: '0 8 * * 1'
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Genereer artikel
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run generate

      - name: Commit en push als er nieuwe content is
        run: |
          git config user.name "ai-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/articles
          git diff --cached --quiet || git commit -m "Nieuw artikel gegenereerd"
          git push
